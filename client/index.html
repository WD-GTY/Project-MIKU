<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 컴페니언 - 학습 메이트</title>
  <script src="/vendor/pixi.min.js"></script>
  <script src="/vendor/live2dcubismcore.min.js"></script>
  <script src="/vendor/cubism4.min.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <main class="layout">
      <!-- 좌측: 아바타 컬럼 -->
      <section class="avatar-column">
        <canvas id="avatar-canvas"></canvas>
        <div id="stage-overlay">
          <select id="avatar-select" title="아바타 모델 선택"></select>
          <button id="btn-tap" title="때리기(놀리기)">👆 건드리기</button>
          <button id="btn-recenter" title="아바타 위치/크기 초기화">🎯</button>
          <span class="zoom-box" title="아바타 크기">
            <span>🔍</span>
            <input id="avatar-zoom" type="range" min="30" max="250" step="1" value="100" />
            <span id="avatar-zoom-label">100%</span>
          </span>
        </div>
      </section>

      <!-- 우측: 칠판 에어리어 -->
      <section class="board-area">
        <!-- 칠판 바디 (대화/판서 영역) -->
        <div class="board-body" id="board-body">
          <div id="chat-log" class="chat-log"></div>
          <div id="explanation-panel" class="explanation-panel" hidden>
            <div class="explanation-toolbar">
              <span id="explanation-title" class="explanation-title">개념 설명</span>
              <button id="btn-close-explanation" type="button" title="닫기">✕</button>
            </div>
            <div id="explanation-content" class="explanation-content"></div>
          </div>
        </div>

        <!-- 하단 입력창 -->
        <div class="input-bar">
          <div class="input-quick-actions">
            <button id="btn-goal-edit" type="button" title="목표 설정">🎯 목표</button>
            <button id="btn-open-materials-2" type="button" title="학습 자료">📁 자료</button>
          </div>
          <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" type="text" placeholder="공부 질문을 입력하거나 마이크로 말해보세요..." />
            <button id="btn-mic" type="button" title="음성 입력">🎤</button>
            <button id="btn-send" type="submit" title="전송">전송</button>
          </form>
        </div>
      </section>
    </main>

    <!-- 드로어 오버레이 -->
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- RAG 자료 관리 드로어 -->
    <aside class="drawer" id="material-drawer">
      <div class="drawer-header">
        <h2>📁 학습 자료 (RAG)</h2>
        <button class="drawer-close" id="btn-close-materials" title="닫기">✕</button>
      </div>
      <div class="drawer-body">
        <form id="upload-form" class="upload-form">
          <input id="upload-file" type="file" accept=".pdf,.txt,.md" />
          <button type="submit">업로드</button>
        </form>
        <div id="material-list" class="material-list"></div>
        <div class="debug-row">
          <input id="rag-query" type="text" placeholder="자료에서 검색 (테스트)" />
          <button id="btn-rag-search" type="button">검색</button>
        </div>
        <div id="rag-results" class="rag-results"></div>
      </div>
    </aside>

    <!-- 목표 설정 모달 -->
    <div class="modal-overlay" id="goal-modal-overlay">
      <div class="modal" id="goal-modal">
        <div class="modal-header">
          <h2>🎯 오늘의 목표</h2>
          <button class="modal-close" id="btn-close-goal" title="닫기">✕</button>
        </div>
        <div class="modal-body">
          <div id="goal-current" class="goal-current"></div>
          <form id="goal-form" class="goal-form">
            <input id="goal-input" type="text" placeholder="예: 미분의 연쇄법칙 마스터하기" />
            <button type="submit">설정</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
